<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manifesto</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Helvetica, Arial, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* subtle grain */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://grainy-gradients.vercel.app/noise.svg');
  opacity: 0.08;
  pointer-events: none;
}

#text {
  max-width: 800px;
  text-align: center;
  font-size: 1.6rem;
  line-height: 2.6rem;
  letter-spacing: 0.2px;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.small {
  font-size: 1rem;
  opacity: 0.6;
}

/* soft fade states */
.show {
  opacity: 1 !important;
}
</style>
</head>

<body>

<div id="text"></div>

<script>
const states = [
`what is unseen is not absence<br>it is structure<br><br><span class="small">meaning begins before it is visible</span>`,

`silence functions as pressure<br>not emptiness<br><br>dialogue conceals as much as it reveals`,

`the frame interrupts reality<br>rather than contains it<br><br>what is outside the frame is still active`,

`interiority shapes every external action<br><br>nothing exists in isolation from what is withheld`,

`I do not construct stories<br>I construct conditions in which stories fail to settle<br><br><span class="small">this is where meaning forms</span>`
];

let i = 0;
const el = document.getElementById("text");

function cycle() {
  el.classList.remove("show");

  setTimeout(() => {
    el.innerHTML = states[i];
    el.classList.add("show");
    i = (i + 1) % states.length;
  }, 1200);
}

cycle();
setInterval(cycle, 5000);
</script>

</body>
</html>
